name: Build & Deploy

# The site is plain static HTML — no Jekyll, no npm.
#
# You only ever edit the SOURCES:
#   data/publications.json   → publication pages
#   content/posts/*.md       → blog posts
#
# This workflow runs the two generators in tools/, commits whatever they
# produced back to the branch, checks the result for dead links and broken
# markup, and publishes the repository root to GitHub Pages.
#
# That means you never have to run Python locally — editing a file directly on
# github.com and hitting "Commit changes" is enough.
#
# Requires: Settings → Pages → Source: "GitHub Actions".

on:
  push:
    # This repository uses "master". "main" is listed too so the workflow keeps
    # working if the branch is ever renamed.
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write      # the build job commits the generated pages
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false   # never cancel a run that might be mid-commit

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      committed: ${{ steps.commit.outputs.committed }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # Inter and JetBrains Mono are served from this domain, never from Google.
      # The download runs only when the files are actually absent — normally
      # they are committed and this step does nothing. Delete assets/fonts/ to
      # force a refresh after a new font release.
      - name: Fetch self-hosted fonts (only if missing)
        run: |
          if ls assets/fonts/*.woff2 >/dev/null 2>&1; then
            echo "Fonts already in the repository — nothing to download."
          else
            python3 tools/fetch_fonts.py
          fi

      # build_i18n.py runs after build_projects.py: /projects/ and the start
      # page contain generated blocks, and the German copies are derived from
      # the finished English pages. It exits non-zero on an untranslated string.
      - name: Generate publication and post pages
        run: |
          python3 tools/build_publication_pages.py
          python3 tools/build_posts.py
          python3 tools/build_projects.py
          python3 tools/build_supervision.py
          python3 tools/build_statement.py
          python3 tools/build_i18n.py
          python3 tools/build_record_pdfs.py --all
          python3 tools/build_redirects.py
          python3 tools/build_sitemap.py

      - name: Commit generated pages
        id: commit
        # Commits are made with GITHUB_TOKEN, which by design does not trigger
        # another workflow run — so this cannot loop.
        run: |
          if git diff --quiet; then
            echo "Generated pages already up to date."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Generators changed the following files:"
          git --no-pager diff --stat

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Regenerate publication and post pages [skip ci]"

          # A failing push must not abort the run: the freshly generated files
          # are already on disk and get deployed either way. The usual cause is
          # Settings -> Actions -> General -> Workflow permissions being set to
          # read-only.
          if git push; then
            echo "committed=true" >> "$GITHUB_OUTPUT"
          else
            echo "committed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Could not push the regenerated pages. The site was still deployed \
          from the freshly generated files, but the repository now lags behind. Check \
          Settings -> Actions -> General -> Workflow permissions (needs read and write)."
          fi

      - name: Check links, anchors and structured data
        run: python3 tools/check_site.py

      - uses: actions/configure-pages@v5
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event_name != 'pull_request'

      - uses: actions/upload-pages-artifact@v4
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event_name != 'pull_request'
        with:
          path: '.'

  deploy:
    needs: build
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
