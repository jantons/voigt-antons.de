name: Build & Deploy

# The site is plain static HTML — no Jekyll, no npm.
#
# You only ever edit the SOURCES:
#   data/publications.json   → publication pages
#   content/posts/*.md       → blog posts
#
# This workflow runs the two generators in tools/, commits whatever they
# produced back to the branch, checks the result for dead links and broken
# markup, and publishes the repository root to GitHub Pages.
#
# That means you never have to run Python locally — editing a file directly on
# github.com and hitting "Commit changes" is enough.
#
# Requires: Settings → Pages → Source: "GitHub Actions".

on:
  push:
    # This repository uses "master". "main" is listed too so the workflow keeps
    # working if the branch is ever renamed.
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write      # the build job commits the generated pages
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false   # never cancel a run that might be mid-commit

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      committed: ${{ steps.commit.outputs.committed }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # Inter and JetBrains Mono are served from this domain, never from Google.
      # The download runs only when the files are actually absent — normally
      # they are committed and this step does nothing. Delete assets/fonts/ to
      # force a refresh after a new font release.
      - name: Fetch self-hosted fonts (only if missing)
        run: |
          if ls assets/fonts/*.woff2 >/dev/null 2>&1; then
            echo "Fonts already in the repository — nothing to download."
          else
            python3 tools/fetch_fonts.py
          fi

      # The page generators need nothing but the standard library. The four PDF
      # documents need reportlab and the typefaces they are set in, and they are
      # generated here rather than by hand so that editing a JSON file on
      # github.com stays enough — the promise this workflow exists for. Without
      # the fonts the scripts fall back to the PDF base-14 Helvetica: the files
      # come out at 18 KB instead of 109 KB with different metrics, so every CI
      # run and every local run would flip them back and forth — and a visitor
      # would download a document in a different typeface than the one tested.
      #
      # Both packages, because they install to different directories:
      # fonts-liberation writes to .../truetype/liberation/ and fonts-liberation2
      # to .../truetype/liberation2/. Installing only the first while the
      # generators looked only in the second is how this went wrong once —
      # silently, for a week. tools/pdf_fonts.py now searches both, and
      # check_site.py reads the font names back out of the finished PDFs.
      - name: Install reportlab and the document typefaces
        run: |
          pip install --quiet reportlab
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            fonts-liberation fonts-liberation2
          python3 tools/pdf_fonts.py

      # Order matters and is not alphabetical:
      #   build_statement writes the statement page, so it must precede i18n
      #   build_i18n derives /de/, so it must precede build_cv_pdf, which parses
      #     de/cv/index.html for the German edition
      #   build_jsonld writes the entity into both language versions, so it has
      #     to run after build_i18n has created them — otherwise the German
      #     pages would carry a copy of the English block
      #   build_llms_txt quotes figures off the finished pages, so it runs last
      #     of the page generators
      #   build_record_pdfs writes the listing on /downloads/, so it runs after
      #     every document it lists exists
      - name: Generate pages and documents
        run: |
          python3 tools/build_publication_pages.py
          python3 tools/build_posts.py
          python3 tools/build_projects.py
          python3 tools/build_supervision.py
          python3 tools/build_artifacts.py
          python3 tools/build_talks.py
          python3 tools/build_statement.py
          python3 tools/build_i18n.py
          python3 tools/build_jsonld.py
          python3 tools/build_llms_txt.py
          python3 tools/build_cv_pdf.py --all
          python3 tools/build_record_pdfs.py --all
          python3 tools/build_redirects.py
          python3 tools/build_sitemap.py

      - name: Commit generated pages
        id: commit
        # Commits are made with GITHUB_TOKEN, which by design does not trigger
        # another workflow run — so this cannot loop.
        run: |
          if git diff --quiet; then
            echo "Generated pages already up to date."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Generators changed the following files:"
          git --no-pager diff --stat

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Regenerate publication and post pages [skip ci]"

          # A failing push must not abort the run: the freshly generated files
          # are already on disk and get deployed either way. The usual cause is
          # Settings -> Actions -> General -> Workflow permissions being set to
          # read-only.
          if git push; then
            echo "committed=true" >> "$GITHUB_OUTPUT"
          else
            echo "committed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Could not push the regenerated pages. The site was still deployed \
          from the freshly generated files, but the repository now lags behind. Check \
          Settings -> Actions -> General -> Workflow permissions (needs read and write)."
          fi

      - name: Check links, anchors and structured data
        run: python3 tools/check_site.py

      - uses: actions/configure-pages@v5
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event_name != 'pull_request'

      - uses: actions/upload-pages-artifact@v4
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event_name != 'pull_request'
        with:
          path: '.'

  deploy:
    needs: build
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
